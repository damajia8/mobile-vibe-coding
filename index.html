<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Mobile-Vibe-Monitor</title>

<style>
  :root {
    --bg-deep:        #0a0a0f;
    --bg-card:        #111118;
    --bg-input:       #0c0c14;
    --border-subtle:  #1e1e2e;
    --accent:         #7c6ff7;
    --accent-glow:    rgba(124, 111, 247, 0.28);
    --green:          #00e676;
    --green-glow:     rgba(0, 230, 118, 0.30);
    --red:            #ff5252;
    --red-glow:       rgba(255, 82, 82, 0.30);
    --orange:         #ff9100;
    --orange-glow:    rgba(255, 145, 0, 0.30);
    --yellow:         #f5c842;
    --yellow-glow:    rgba(245, 200, 66, 0.35);

    --agent-claude:   #3b82f6;
    --agent-claude-glow: rgba(59, 130, 246, 0.35);
    --agent-kimi:     #10b981;
    --agent-kimi-glow:  rgba(16, 185, 129, 0.35);
    --agent-offline:  #4a4a5a;
    --agent-offline-glow: rgba(74,74,90,0.20);

    --text-primary:   #e0e0e0;
    --text-muted:     #7a7a8a;
    --radius:         12px;
    --radius-sm:      8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; padding: 0;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

  .app-shell {
    max-width: 540px;
    margin: 0 auto;
    padding: 14px 12px 120px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ================================================================
     工作区标题
     ================================================================ */
  .workspace-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
  }
  .workspace-badge .w-icon  { font-size: 1.2rem; flex-shrink: 0; }
  .workspace-badge .w-info  { flex: 1; min-width: 0; }
  .workspace-badge .w-label { color: var(--text-muted); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .workspace-badge .w-name  { color: var(--accent); font-weight: 700; font-size: 0.95rem; word-break: break-all; }
  .btn-refresh {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-subtle);
    background: var(--bg-input); color: var(--text-muted); font-size: 1rem;
    cursor: pointer; flex-shrink: 0; line-height: 1;
    transition: all 0.15s; padding: 0; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-refresh:active { background: var(--accent); color: #fff; border-color: var(--accent); transform: rotate(180deg); }
  .btn-refresh.spinning { animation: spin 0.6s ease-in-out; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .conn-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .conn-dot.online  { background: var(--green); box-shadow: 0 0 8px var(--green-glow); }
  .conn-dot.offline { background: var(--red);   box-shadow: 0 0 8px var(--red-glow); }

  /* ================================================================
     AI 状态 Pod
     ================================================================ */
  .agent-pod {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    transition: all 0.40s ease;
  }
  .agent-pod.agent-offline {
    background: rgba(74,74,90,0.10);
    border-color: var(--agent-offline);
    color: var(--agent-offline);
    box-shadow: 0 0 6px var(--agent-offline-glow);
  }
  .agent-pod.agent-claude {
    background: rgba(59,130,246,0.10);
    border-color: var(--agent-claude);
    color: var(--agent-claude);
    box-shadow: 0 0 16px var(--agent-claude-glow);
    animation: pulse-blue 2.0s ease-in-out infinite;
  }
  .agent-pod.agent-kimi {
    background: rgba(16,185,129,0.10);
    border-color: var(--agent-kimi);
    color: var(--agent-kimi);
    box-shadow: 0 0 16px var(--agent-kimi-glow);
    animation: pulse-green 1.5s ease-in-out infinite;
  }
  @keyframes pulse-blue {
    0%, 100% { box-shadow: 0 0 12px var(--agent-claude-glow); }
    50%      { box-shadow: 0 0 26px var(--agent-claude-glow); }
  }
  @keyframes pulse-green {
    0%, 100% { box-shadow: 0 0 10px var(--agent-kimi-glow); }
    50%      { box-shadow: 0 0 24px var(--agent-kimi-glow); }
  }
  .agent-pod .agent-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    transition: background 0.35s;
  }
  .agent-pod.agent-offline .agent-dot { background: var(--agent-offline); }
  .agent-pod.agent-claude  .agent-dot { background: var(--agent-claude);  box-shadow: 0 0 8px var(--agent-claude-glow); }
  .agent-pod.agent-kimi    .agent-dot { background: var(--agent-kimi);    box-shadow: 0 0 8px var(--agent-kimi-glow); }

  /* ================================================================
     人工干预栏 —— 常驻于 AI 状态下方
     ================================================================ */
  .intervene-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    transition: all 0.35s ease;
  }
  .intervene-bar.disabled {
    opacity: 0.35; pointer-events: none;
  }

  .intervene-icon { font-size: 1.2rem; flex-shrink: 0; line-height: 1; }
  .intervene-hint { flex: 1; min-width: 0; }
  .intervene-hint .hint-title { font-size: 0.82rem; font-weight: 700; line-height: 1.3; }

  .intervene-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .intervene-actions button {
    padding: 10px 16px;
    border-radius: 22px;
    border: none;
    font-size: 0.82rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .intervene-actions button:active { transform: scale(0.94); }

  .btn-yes {
    background: rgba(0,230,118,0.15);
    color: var(--green);
    border: 1px solid rgba(0,230,118,0.35);
    box-shadow: 0 0 10px var(--green-glow);
  }
  .btn-yes:active { background: rgba(0,230,118,0.32); box-shadow: 0 0 18px var(--green-glow); }

  .btn-allow {
    background: rgba(245,200,66,0.12);
    color: var(--yellow);
    border: 1px solid rgba(245,200,66,0.30);
    box-shadow: 0 0 10px var(--yellow-glow);
  }
  .btn-allow:active { background: rgba(245,200,66,0.26); box-shadow: 0 0 18px var(--yellow-glow); }
  .btn-allow:disabled {
    opacity: 0.28; pointer-events: none; box-shadow: none; color: var(--text-muted);
    border-color: var(--border-subtle); background: var(--bg-input);
  }

  .btn-no {
    background: rgba(255,82,82,0.10);
    color: var(--red);
    border: 1px solid rgba(255,82,82,0.25);
    box-shadow: 0 0 8px var(--red-glow);
  }
  .btn-no:active { background: rgba(255,82,82,0.22); box-shadow: 0 0 16px var(--red-glow); }

  /* ================================================================
     操作反馈窗口
     ================================================================ */
  .feedback-window {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 10px 14px;
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .feedback-window.success {
    border-color: var(--green);
    box-shadow: 0 0 10px var(--green-glow);
  }
  .feedback-window.error {
    border-color: var(--red);
    box-shadow: 0 0 10px var(--red-glow);
  }
  .feedback-window.processing {
    border-color: var(--yellow);
    box-shadow: 0 0 10px var(--yellow-glow);
  }
  .feedback-icon { font-size: 1.1rem; flex-shrink: 0; }
  .feedback-text { flex: 1; word-break: break-all; }
  .feedback-empty { color: var(--text-muted); }

  /* ================================================================
     底部提示词 + 发送栏
     ================================================================ */
  .prompt-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: var(--bg-deep);
    border-top: 1px solid var(--border-subtle);
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex; gap: 8px;
  }
  .prompt-bar input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border-subtle);
    border-radius: 24px;
    padding: 12px 18px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .prompt-bar input:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
  .prompt-bar input:disabled {
    opacity: 0.4; pointer-events: none; border-color: var(--agent-offline);
  }

  .prompt-bar .btn-send {
    flex-shrink: 0;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .prompt-bar .btn-send:active { transform: scale(0.92); background: #9488ff; }
  .prompt-bar .btn-send:disabled {
    opacity: 0.4; pointer-events: none; background: var(--agent-offline);
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--bg-card); border: 1px solid var(--border-active);
    color: var(--text-primary); padding: 10px 22px; border-radius: 24px;
    font-size: 0.78rem; z-index: 999; opacity: 0; pointer-events: none;
    transition: opacity 0.30s; box-shadow: 0 4px 24px rgba(0,0,0,0.55);
    white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app-shell">

  <!-- 工作区 -->
  <div class="workspace-badge">
    <span class="w-icon">&#x1F3E0;</span>
    <div class="w-info">
      <div class="w-label">当前远程工作区</div>
      <div class="w-name" id="workspace-title">加载中…</div>
    </div>
    <button class="btn-refresh" id="btn-refresh" title="刷新工作区">&#x21BB;</button>
    <div class="conn-dot offline" id="conn-dot" title="WS 连接状态"></div>
  </div>

  <!-- AI 状态 Pod -->
  <div class="agent-pod agent-offline" id="agent-pod">
    <span class="agent-dot"></span>
    <span id="agent-label">❌ 电脑端 AI 插件断联</span>
  </div>

  <!-- 人工干预栏（常驻） -->
  <div class="intervene-bar disabled" id="intervene-bar">
    <span class="intervene-icon" id="intervene-icon">&#x23F3;</span>
    <div class="intervene-hint">
      <div class="hint-title" id="hint-title">等待 AI 上线…</div>
    </div>
    <div class="intervene-actions">
      <button class="btn-yes"   id="btn-yes">Yes</button>
      <button class="btn-allow" id="btn-allow">Allow</button>
      <button class="btn-no"    id="btn-no">No</button>
    </div>
  </div>

  <!-- 操作反馈窗口 -->
  <div class="feedback-window" id="feedback">
    <span class="feedback-icon" id="feedback-icon"></span>
    <span class="feedback-text feedback-empty" id="feedback-text">等待操作…</span>
  </div>

</div>

<!-- 底部提示词输入栏 -->
<div class="prompt-bar" id="prompt-bar">
  <input type="text" id="prompt-input" placeholder="AI 断联中，无法发送提示词…" autocomplete="off" enterkeyhint="send" disabled>
  <button class="btn-send" id="btn-send" disabled>&#x27A4;</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var protocol = location.protocol === "https:" ? "wss" : "ws";
  var wsUrl = protocol + "://" + location.host + "/ws";
  var ws = null;
  var reconnectTimer = null;
  var heartbeatTimer = null;
  var currentAgent = "OFFLINE";

  var $ = function (s) { return document.querySelector(s); };

  var elTitle         = $("#workspace-title");
  var elBtnRefresh    = $("#btn-refresh");
  var elConnDot       = $("#conn-dot");
  var elAgentPod      = $("#agent-pod");
  var elAgentLabel    = $("#agent-label");
  var elFeedback      = $("#feedback");
  var elFeedbackIcon  = $("#feedback-icon");
  var elFeedbackText  = $("#feedback-text");
  var elInterveneBar  = $("#intervene-bar");
  var elInterveneIcon = $("#intervene-icon");
  var elHintTitle     = $("#hint-title");
  var elBtnYes        = $("#btn-yes");
  var elBtnAllow      = $("#btn-allow");
  var elBtnNo         = $("#btn-no");
  var elPromptBar     = $("#prompt-bar");
  var elPromptInput   = $("#prompt-input");
  var elBtnSend       = $("#btn-send");
  var elToast         = $("#toast");

  /* ====================================================================
     Agent 配置
     ==================================================================== */
  var AGENT_CFG = {
    "OFFLINE": {
      cssClass: "agent-offline",
      label: "❌ 电脑端 AI 插件断联",
      placeholder: "AI 断联中，无法发送提示词…"
    },
    "Claude Code": {
      cssClass: "agent-claude",
      label: "🤖 Claude Code 持续守护中",
      placeholder: "输入提示词，发送给 Claude Code…"
    },
    "Kimi": {
      cssClass: "agent-kimi",
      label: "🔥 Kimi Code 正在疯狂敲代码",
      placeholder: "输入提示词，发送给 Kimi…"
    }
  };

  function updateAgentUI(agentName) {
    currentAgent = agentName;
    var cfg = AGENT_CFG[agentName] || AGENT_CFG["OFFLINE"];
    elAgentPod.className = "agent-pod " + cfg.cssClass;
    elAgentLabel.textContent = cfg.label;
    var offline = (agentName === "OFFLINE");
    elPromptInput.disabled = offline;
    elPromptInput.placeholder = cfg.placeholder;
    if (offline) {
      elBtnSend.disabled = true;
      elInterveneBar.classList.add("disabled");
      setInterveneHint("idle");
    } else {
      elBtnSend.disabled = false;
      elInterveneBar.classList.remove("disabled");
      setInterveneHint("idle");
    }
  }

  /* ====================================================================
     反馈窗口
     ==================================================================== */
  function setFeedback(type, msg) {
    elFeedback.className = "feedback-window " + type;
    elFeedbackText.classList.remove("feedback-empty");
    elFeedbackText.textContent = msg;
    if (type === "success") {
      elFeedbackIcon.textContent = "✅";
    } else if (type === "error") {
      elFeedbackIcon.textContent = "❌";
    } else if (type === "processing") {
      elFeedbackIcon.textContent = "⏳";
    } else {
      elFeedbackIcon.textContent = "";
    }
  }

  /* ====================================================================
     人工干预：提示文字与按键
     ==================================================================== */
  var optionMode = 3; // 当前选项数量，点击图标切换 2/3

  function applyOptionMode() {
    // Allow 按钮在 2 选项时变灰失效
    if (optionMode === 2) {
      elBtnAllow.disabled = true;
    } else {
      elBtnAllow.disabled = false;
    }
  }

  function setInterveneHint(state) {
    applyOptionMode();
    if (state === "confirm") {
      elInterveneIcon.textContent = "⚠️";
      elHintTitle.textContent = "有待审批的变更";
    } else {
      elInterveneIcon.textContent = optionMode === 2 ? "⏳₂" : "⏳₃";
      elHintTitle.textContent = "暂无待审批变更";
    }
  }

  // 点击图标切换 2/3 选项模式
  elInterveneIcon.addEventListener("click", function () {
    optionMode = (optionMode === 2) ? 3 : 2;
    setInterveneHint("idle");
    showToast(optionMode + " 选项模式");
  });

  function sendKey(key) {
    if (currentAgent === "OFFLINE") { showToast("AI 已断联"); return; }
    // 2 选项模式下 Allow 失效，不发送
    if (key === "2" && optionMode === 2) {
      showToast("Allow 不可用");
      return;
    }
    var labels = { "1": "Yes", "2": "Allow", "3": "No" };
    sendJSON({ action: "intervene", key: key });
    setFeedback("success", labels[key] + "，按键" + key);
    showToast(labels[key]);
    setInterveneHint("idle");
    if (navigator.vibrate) navigator.vibrate(30);
  }

  /* ====================================================================
     Toast
     ==================================================================== */
  var toastTimer = null;
  function showToast(msg) {
    elToast.textContent = msg;
    elToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove("show"); }, 2600);
  }


  /* ====================================================================
     连接指示器
     ==================================================================== */
  function setOnline(v) {
    elConnDot.className = "conn-dot " + (v ? "online" : "offline");
  }

  /* ====================================================================
     发送 JSON
     ==================================================================== */
  function sendJSON(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      showToast("未连接到服务端");
      return;
    }
    ws.send(JSON.stringify(obj));
  }

  /* ====================================================================
     WebSocket
     ==================================================================== */
  function connect() {
    if (ws && ws.readyState === WebSocket.OPEN) return;

    ws = new WebSocket(wsUrl);

    ws.onopen = function () {
      setOnline(true);
      showToast("已连接到服务端");
      setInterveneHint("idle");
      clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(function () {
        sendJSON({ action: "ping" });
      }, 30000);
    };

    ws.onmessage = function (ev) {
      var data;
      try { data = JSON.parse(ev.data); } catch (_) { return; }

      switch (data.type) {

        case "init_workspace":
        case "workspace_switch":
          elTitle.textContent = data.workspace_name;
          document.title = "Vibe · " + data.workspace_name;
          if (data.active_agent) updateAgentUI(data.active_agent);
          break;

        case "state_sync":
          if (data.active_agent !== undefined) updateAgentUI(data.active_agent);

          if (data.data.status === "WAITING_CONFIRM" && currentAgent !== "OFFLINE") {
            setInterveneHint("confirm");
            setFeedback("processing", data.data.thinking || "检测到变更，等待确认…");
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          } else if (data.data.status === "IDLE") {
            setInterveneHint("idle");
          }
          break;

        case "agent_status_change":
          updateAgentUI(data.active_agent);
          if (data.active_agent !== "OFFLINE") {
            showToast(data.active_agent + " 已上线！");
            setFeedback("success", data.active_agent + " 已上线，可以发送提示词");
          } else {
            showToast("⚠️ AI 已断联");
            setFeedback("error", "AI 插件已断联，操作已锁定");
          }
          break;

        case "workspace_change":
          if (navigator.vibrate && currentAgent !== "OFFLINE") {
            navigator.vibrate([200, 100, 200]);
          }
          break;

        case "log":
          break;

        case "prompt_received":
          setFeedback("processing", data.message || "正在粘贴…");
          showToast(data.message || "已送达");
          break;

        case "error":
          setFeedback("error", data.message);
          showToast(data.message);
          break;

        case "workspace_refreshed":
          showToast("工作区: " + data.workspace_name);
          break;

        case "pong":
          if (data.active_agent !== undefined) updateAgentUI(data.active_agent);
          break;

        default:
          break;
      }
    };

    ws.onclose = function () {
      setOnline(false);
      clearInterval(heartbeatTimer);
      setFeedback("error", "WebSocket 断开，正在重连…");
      setTimeout(function () {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          connect();
        }, 5000);
      }, 0);
    };

    ws.onerror = function () {};
  }

  /* ====================================================================
     按钮事件
     ==================================================================== */

  // 发送提示词
  function sendPrompt() {
    if (currentAgent === "OFFLINE") { showToast("AI 已断联"); return; }
    var text = elPromptInput.value.trim();
    if (!text) { showToast("请输入提示词"); return; }
    sendJSON({ action: "prompt", text: text });
    elPromptInput.value = "";
    setFeedback("processing", "正在粘贴: " + text.slice(0, 40) + (text.length > 40 ? "…" : ""));
  }

  elBtnSend.addEventListener("click", sendPrompt);

  elPromptInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      sendPrompt();
    }
  });

  // 刷新工作区
  elBtnRefresh.addEventListener("click", function () {
    elBtnRefresh.classList.add("spinning");
    sendJSON({ action: "refresh_workspace" });
    showToast("正在刷新…");
    setTimeout(function () { elBtnRefresh.classList.remove("spinning"); }, 600);
  });

  // 人工干预按键
  elBtnYes.addEventListener("click",  function () { sendKey("1"); });
